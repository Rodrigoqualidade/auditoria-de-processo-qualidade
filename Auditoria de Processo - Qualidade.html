<meta name="theme-color" content="#132E53">
<meta name="apple-mobile-web-app-title" content="Auditoria de Processo">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===========================================================
   Identidade visual: Filtros Brasil (azul-marinho + vermelho).
   Layout: rail fixa (sempre na cor da marca) + area de conteudo
   que segue o tema claro/escuro escolhido pelo usuario (botao
   sol/lua na rail, persistido em localStorage).
   =========================================================== */
:root{
  --brand-navy:#132E53; --brand-navy-2:#0D2240; --brand-red:#EB1C2C; --brand-red-dark:#C4141F;
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F5F7FA;
  --fg:#16233D; --fg-muted:#5B6B80; --border:#DCE2E9;
  --accent:#17386B; --accent-fg:#FFFFFF; --accent-soft:#E3E9F3;
  --ok:#2E7D5B; --ok-soft:#DFF1E7;
  --warn:#B9791F; --warn-soft:#FBEDD6;
  --bad:#C23B30; --bad-soft:#FBE3E0;
  --na:#8C97A1; --na-soft:#E7EBED;
  --font-display:'Poppins',system-ui,-apple-system,sans-serif;
  --font-body:'Work Sans',system-ui,-apple-system,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1826; --panel:#17233A; --panel-2:#1C2A45;
    --fg:#E8ECF4; --fg-muted:#93A1B8; --border:#2B3B5C;
    --accent:#6FA3E6; --accent-fg:#0B1A2E; --accent-soft:#213A5E;
    --ok:#5FC590; --ok-soft:#153427;
    --warn:#E0AC51; --warn-soft:#3A2F18;
    --bad:#E38374; --bad-soft:#3C201D;
    --na:#7C8AA0; --na-soft:#23304A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1826; --panel:#17233A; --panel-2:#1C2A45;
  --fg:#E8ECF4; --fg-muted:#93A1B8; --border:#2B3B5C;
  --accent:#6FA3E6; --accent-fg:#0B1A2E; --accent-soft:#213A5E;
  --ok:#5FC590; --ok-soft:#153427;
  --warn:#E0AC51; --warn-soft:#3A2F18;
  --bad:#E38374; --bad-soft:#3C201D;
  --na:#7C8AA0; --na-soft:#23304A;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;
  padding-left:max(0px, env(safe-area-inset-left,0px));
  padding-right:max(0px, env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:600}
button{font-family:inherit}
::selection{background:var(--accent-soft)}

#app{display:flex;min-height:100%}

/* ---- Rail (sempre na cor da marca — nao segue o tema claro/escuro) ---- */
#rail{
  width:224px;flex:0 0 224px;background:var(--brand-navy);border-right:1px solid var(--brand-navy-2);
  padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;
  align-self:flex-start;height:100vh;overflow-y:auto;
}
.rail-brand{padding:6px 8px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.rail-logo{width:132px;height:auto;display:block}
.rail-brand .tagline{font-size:10.5px;letter-spacing:.03em;color:#AEBBD4;padding-left:2px}
.theme-toggle{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:#DCE4F2;cursor:pointer;font-size:12.5px;font-weight:600;width:100%;
  text-align:left;margin:2px 0 10px;
}
.theme-toggle:hover{background:rgba(255,255,255,.1)}
.theme-toggle svg{flex:0 0 15px;width:15px;height:15px}
#lock-toggle{margin-top:0;margin-bottom:10px;color:#F2BFC2}
#lock-toggle.unlocked{color:#9FE3BE}

.modal-overlay{position:fixed;inset:0;background:rgba(10,16,26,.55);display:none;align-items:center;
  justify-content:center;z-index:100;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--panel);border-radius:14px;padding:22px 22px 20px;width:100%;max-width:320px;
  box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-box h3{font-size:17px;margin-bottom:6px}
.modal-box .sub{font-size:12.5px;color:var(--fg-muted);margin-bottom:14px;line-height:1.4}
.modal-box input[type=password]{width:100%;border:1px solid var(--border);background:var(--panel-2);color:var(--fg);
  border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit}
.unlock-err{color:var(--bad);font-size:12px;margin-top:7px}
.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.modal-cancel{background:transparent;border:1px solid var(--border);color:var(--fg-muted);border-radius:9px;
  padding:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.modal-cancel:hover{background:var(--panel-2)}
.rail-btn{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:none;
  background:transparent;color:#C9D3E4;text-align:left;cursor:pointer;font-size:14px;font-weight:500;
}
.rail-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.rail-btn.active{background:rgba(235,28,44,.16);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--brand-red)}
.rail-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:#5C6E8C}
.rail-dot.ok{background:#4ED397} .rail-dot.warn{background:#F2BA55} .rail-dot.bad{background:#F27362}
.rail-sep{height:1px;background:rgba(255,255,255,.12);margin:10px 4px}
.rail-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7E8CA8;padding:8px 10px 2px;font-weight:600}

/* ---- Main ---- */
#main{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 60px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{font-size:26px}
.topbar p{color:var(--fg-muted);font-size:13.5px;margin-top:4px;max-width:60ch}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-muted);background:var(--panel);
  border:1px solid var(--border);padding:6px 12px;border-radius:999px;white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

.view{display:none}
.view.active{display:block}

/* ---- Barra de filtros (Visao Geral) ---- */
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;margin-bottom:20px}
.filter-group{display:flex;align-items:center;gap:7px}
.filter-group label{font-size:11.5px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.03em}
.filter-bar select{border:1px solid var(--border);background:var(--panel-2);color:var(--fg);border-radius:7px;
  padding:6px 9px;font-size:13px;font-family:inherit;font-weight:600}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--panel-2);color:var(--fg-muted);font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.setor-dd{position:relative}
.setor-dd-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--fg);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;min-width:168px;justify-content:space-between}
.setor-dd-btn svg{width:13px;height:13px;flex:0 0 13px;color:var(--fg-muted)}
.setor-dd-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;padding:8px;min-width:220px;max-height:280px;overflow-y:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.14)}
.setor-dd-item{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--fg);font-weight:500}
.setor-dd-item:hover{background:var(--panel-2)}
.setor-dd-item.strong{font-weight:700}
.setor-dd-item input{width:15px;height:15px;accent-color:var(--accent);flex:0 0 15px;cursor:pointer}
.setor-dd-sep{height:1px;background:var(--border);margin:6px 2px}
.setor-dd-apply{width:100%;margin-top:8px;background:var(--accent);color:var(--accent-fg);border:none;
  border-radius:7px;padding:8px;font-weight:700;font-size:12.5px;cursor:pointer}
.setor-dd-apply:hover{opacity:.9}
.filter-spacer{flex:1}
.btn-pdf{display:inline-flex;align-items:center;gap:7px;background:var(--brand-red);color:#fff;border:none;
  border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-pdf:hover{background:var(--brand-red-dark)}
.btn-pdf:disabled{opacity:.6;cursor:wait}
.btn-pdf svg{width:15px;height:15px}
.filter-empty{font-size:12.5px;color:var(--fg-muted);padding:2px 2px 4px}

/* ---- Cards / grid ---- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px;cursor:pointer;
  transition:border-color .15s, transform .15s;}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-top .name{font-weight:600;font-size:14.5px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--na-soft);color:var(--na-fg,var(--fg-muted))}
.card .pct{font-size:32px;margin-top:10px;line-height:1}
.card .meta{font-size:12px;color:var(--fg-muted);margin-top:6px;display:flex;justify-content:space-between}
.card svg.spark{width:100%;height:36px;margin-top:10px;display:block}

/* ---- Panels ---- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 18px 10px;margin-bottom:22px}
.panel h3{font-size:15px;margin-bottom:2px}
.panel .sub{font-size:12.5px;color:var(--fg-muted);margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 4px;font-size:12px;color:var(--fg-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---- Sector layout ---- */
.sector-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
@media (max-width:980px){.sector-grid{grid-template-columns:1fr}}

.status-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.status-chip{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.status-chip .n{font-size:24px}
.status-chip .l{font-size:11.5px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* checklist items */
.item-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel-2)}
.item-row .txt{font-size:13.5px;line-height:1.4;margin-bottom:8px}
.item-row .cat{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--panel);color:var(--fg-muted);font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button[data-v="Conforme"].sel{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v="Não Conforme"].sel{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[data-v="N/A"].sel{background:var(--na);border-color:var(--na);color:#fff}
.seg button:hover{border-color:var(--accent)}
.item-obs{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:7px;
  padding:6px 9px;font-size:12.5px;font-family:inherit;margin-top:8px}
.item-obs::placeholder{color:var(--fg-muted)}

tr.hist-row{cursor:pointer}
tr.hist-row:hover{background:var(--panel-2)}
tr.hist-detail td{background:var(--panel-2);padding:0;border-bottom:1px solid var(--border)}
tr.hist-detail .inner{padding:10px 12px;display:none;flex-direction:column;gap:6px}
tr.hist-detail.open .inner{display:flex}
.detail-item{font-size:12px;display:flex;gap:8px}
.detail-item .dn{font-weight:600;min-width:20px;color:var(--fg-muted)}
.detail-item .dv{color:var(--fg-muted);font-style:italic}
.hist-toggle{color:var(--accent);font-size:11.5px;font-weight:600;text-decoration:underline;cursor:pointer}

label.field{display:block;font-size:12px;font-weight:600;color:var(--fg-muted);margin:12px 0 5px}
input[type=date],input[type=text],textarea{
  width:100%;border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:8px;
  padding:8px 10px;font-size:13.5px;font-family:inherit}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn-primary{background:var(--accent);color:var(--accent-fg);border:none;border-radius:9px;padding:11px 18px;
  font-weight:700;font-size:14px;cursor:pointer;margin-top:16px}
.btn-primary:hover{opacity:.92}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.save-msg{font-size:12.5px;margin-top:8px;color:var(--ok)}
.save-msg.err{color:var(--bad)}

table.hist{width:100%;border-collapse:collapse;font-size:12.5px}
table.hist th{text-align:left;color:var(--fg-muted);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--border)}
table.hist td{padding:7px 8px;border-bottom:1px solid var(--border)}
table.hist tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}

.empty-state{text-align:center;padding:30px 10px;color:var(--fg-muted);font-size:13.5px}

/* mobile rail -> top strip */
@media (max-width:760px){
  #app{flex-direction:column}
  #rail{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;
    padding:8px 10px;gap:6px;align-items:center}
  .rail-brand{display:flex;flex-direction:row;align-items:center;padding:0;flex:0 0 auto}
  .rail-brand .tagline{display:none}
  .rail-logo{width:84px}
  .theme-toggle{width:auto;margin:0;padding:8px;justify-content:center}
  .theme-toggle .tl{display:none}
  .rail-sep{display:none}
  .rail-label{display:none}
  .rail-btn{flex:0 0 auto;white-space:nowrap}
  #main{padding:18px 16px 50px;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));}
  .filter-bar{flex-direction:column;align-items:stretch}
  .filter-spacer{display:none}
}

   aba, o que apagaria um texto só setado direto no elemento. */
let connStatus = { color:"var(--fg-muted)", text:"Conectando…" };
function setConnStatus(color, text){
  connStatus = { color, text };
  applySyncIndicator();
}
function applySyncIndicator(){
  const t = $("#sync-text"), d = $("#sync-dot");
  if(t) t.textContent = connStatus.text;
  if(d) d.style.background = connStatus.color;
}

function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));

function isUnlocked(){
  try{ return localStorage.getItem("fb_edit_unlocked") === "1"; }catch(e){ return false; }
}
function setUnlocked(v){
  try{
    if(v) localStorage.setItem("fb_edit_unlocked", "1");
    else localStorage.removeItem("fb_edit_unlocked");
  }catch(e){}
  updateLockIndicator();
}
function updateLockIndicator(){
  const btn = $("#lock-toggle");
  if(!btn) return;
  const unlocked = isUnlocked();
  btn.classList.toggle("unlocked", unlocked);
  btn.querySelector(".ll").textContent = unlocked ? "Edição liberada" : "Edição bloqueada";
  btn.querySelector(".li").innerHTML = unlocked
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.3-2.3"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
}

let pendingUnlockCallback = null;
function buildUnlockModal(){
  if($("#unlock-modal")) return;
  const wrap = document.createElement("div");
  wrap.id = "unlock-modal";
  wrap.className = "modal-overlay";
  wrap.innerHTML = `
    <div class="modal-box">
      <h3>Senha de edição</h3>
      <p class="sub">Digite a senha para liberar o salvamento de auditorias neste navegador.</p>
      <input type="password" id="unlock-input" placeholder="Senha" autocomplete="off">
      <div class="unlock-err" id="unlock-err" style="display:none">Senha incorreta.</div>
      <div class="modal-actions">
        <button type="button" class="btn-primary" id="unlock-ok" style="margin-top:0">Liberar edição</button>
        <button type="button" class="modal-cancel" id="unlock-cancel">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  function close(){ wrap.classList.remove("open"); $("#unlock-input").value=""; $("#unlock-err").style.display="none"; pendingUnlockCallback=null; }
  function tryUnlock(){
    const val = $("#unlock-input").value;
    if(val === EDIT_PASSWORD){
      setUnlocked(true);
      const cb = pendingUnlockCallback;
      close();
      if(cb) cb();
    } else {
      $("#unlock-err").style.display = "block";
    }
  }
  $("#unlock-ok").onclick = tryUnlock;
  $("#unlock-input").onkeydown = (e)=>{ if(e.key==="Enter") tryUnlock(); };
  $("#unlock-cancel").onclick = close;
  wrap.onclick = (ev)=>{ if(ev.target===wrap) close(); };
}
function requestUnlock(callback){
  if(isUnlocked()){ callback(); return; }
  buildUnlockModal();
  pendingUnlockCallback = callback;
  const modal = $("#unlock-modal");
  modal.classList.add("open");
  $("#unlock-input").value = "";
  $("#unlock-err").style.display = "none";
  setTimeout(()=> $("#unlock-input").focus(), 50);
}

function mondayISO(d){
  d = new Date(d);
  const day = d.getDay(); // 0=domingo
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  const [y,m,d]=iso.split("-");
  return `${d}/${m}`;
}
function fmtDateFull(iso){
  const [y,m,d]=iso.split("-");
  return `${d}/${m}/${y}`;
}
function pct(n){ return (n==null) ? "—" : (Math.round(n*1000)/10).toFixed(1)+"%"; }
function statusOf(p){
  if(p==null) return "na";
  if(p>=0.95) return "ok";
  if(p>=0.85) return "warn";
  return "bad";
}
function statusLabel(s){
  return s==="ok" ? "Bom" : s==="warn" ? "Atenção" : s==="bad" ? "Crítico" : "Sem dados";
}

function entryPct(entry, itens){
  let c=0,nc=0;
  (entry.itens||[]).forEach(v=>{ if(v==="Conforme") c++; else if(v==="Não Conforme") nc++; });
  const total=c+nc;
  return total? c/total : null;
}
function entryNC(entry){
  return (entry.itens||[]).filter(v=>v==="Não Conforme").length;
}
function entriesFor(key){
  return allEntries.filter(e=>e.setor===key).sort((a,b)=> a.semana<b.semana? -1 : a.semana>b.semana?1:0);
}
function latestEntry(key){
  const list = entriesFor(key);
  return list.length? list[list.length-1] : null;
}

/* ============================================================
   3. SVG MINI-CHARTS (sem libs — desenhados à mão)
   ============================================================ */
const SVGNS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs){
  const el=document.createElementNS(SVGNS,tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  return el;
}

function drawSparkline(svg, points, color){
  svg.innerHTML="";
  if(!points.length){ return; }
  const w=240,h=36,pad=3;
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  const vals = points.map(p=>p.y).filter(v=>v!=null);
  if(!vals.length) return;
  const min=Math.min(0.75,...vals), max=Math.max(1,...vals);
  const xs = points.map((p,i)=> pad + i*( (w-2*pad) / Math.max(1,points.length-1) ));
  const ys = points.map(p=> p.y==null? null : h-pad - ( (p.y-min)/(max-min||1) )*(h-2*pad) );
  let d="";
  xs.forEach((x,i)=>{
    if(ys[i]==null) return;
    d += (d===""?"M":"L") + x.toFixed(1) + " " + ys[i].toFixed(1) + " ";
  });
  svg.appendChild(svgEl("path",{d, fill:"none", stroke:color, "stroke-width":2, "stroke-linecap":"round","stroke-linejoin":"round"}));
  // ultimo ponto
  const lastI = points.length-1;
  if(ys[lastI]!=null){
    const st = statusOf(points[lastI].y);
    const dotColor = st==="ok"? "var(--ok)": st==="warn"?"var(--warn)": st==="bad"?"var(--bad)":color;
    svg.appendChild(svgEl("circle",{cx:xs[lastI],cy:ys[lastI],r:3,fill:dotColor}));
  }
}

function drawLineChart(svg, series, opts){
  // series: [{name,color,points:[{x:iso,y:0-1|null}]}]
  svg.innerHTML="";
  const w = opts.w||720, h= opts.h||230;
  const padL=36, padR=10, padT=14, padB=26;
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  svg.setAttribute("width","100%");
  const allX = Array.from(new Set(series.flatMap(s=>s.points.map(p=>p.x)))).sort();
  if(!allX.length){ return; }
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const xPos = x => padL + (allX.indexOf(x)/Math.max(1,allX.length-1))*innerW;
  const yPos = y => padT + (1-y)*innerH;

  // grid + eixo Y (0/25/50/75/100%)
  [0,.25,.5,.75,1].forEach(g=>{
    const y=yPos(g);
    svg.appendChild(svgEl("line",{x1:padL,x2:w-padR,y1:y,y2:y,stroke:"var(--border)","stroke-width":1}));
    const t=svgEl("text",{x:padL-6,y:y+3,"text-anchor":"end","font-size":9,fill:"var(--fg-muted)"});
    t.textContent=(g*100)+"%"; svg.appendChild(t);
  });
  // linhas de referencia 85% / 95%
  [[0.95,"var(--ok)"],[0.85,"var(--warn)"]].forEach(([v,c])=>{
    const y=yPos(v);
    const l=svgEl("line",{x1:padL,x2:w-padR,y1:y,y2:y,stroke:c,"stroke-width":1,"stroke-dasharray":"3,3",opacity:.55});
    svg.appendChild(l);
  });
  // eixo X (rotulos a cada N pontos)
  const step = Math.max(1, Math.ceil(allX.length/8));
  allX.forEach((x,i)=>{
    if(i%step!==0 && i!==allX.length-1) return;
    const t=svgEl("text",{x:xPos(x),y:h-8,"text-anchor":"middle","font-size":9,fill:"var(--fg-muted)"});
    t.textContent=fmtDate(x); svg.appendChild(t);
  });

  series.forEach(s=>{
    let d="";
    s.points.forEach(p=>{
      if(p.y==null) { d+=""; return; }
      const x=xPos(p.x), y=yPos(p.y);
      d += (d===""?"M":"L") + x.toFixed(1)+" "+y.toFixed(1)+" ";
    });
    if(d) svg.appendChild(svgEl("path",{d,fill:"none",stroke:s.color,"stroke-width":s.emph?3:2,"stroke-linecap":"round","stroke-linejoin":"round"}));
    s.points.forEach(p=>{
      if(p.y==null) return;
      const x=xPos(p.x), y=yPos(p.y);
      const st=statusOf(p.y);
      const fill = s.semantic!==false ? (st==="ok"?"var(--ok)":st==="warn"?"var(--warn)":"var(--bad)") : s.color;
      svg.appendChild(svgEl("circle",{cx:x,cy:y,r:s.emph?3.4:2.6,fill}));
    });
  });
}

function drawBarChart(svg, bars, opts){
  // bars: [{label,value(0-1|null),color}]
  svg.innerHTML="";
  const w=opts.w||720, h=opts.h||220, padL=36,padR=10,padT=14,padB=34;
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  svg.setAttribute("width","100%");
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const bw = innerW/bars.length;
  [0,.25,.5,.75,1].forEach(g=>{
    const y=padT+(1-g)*innerH;
    svg.appendChild(svgEl("line",{x1:padL,x2:w-padR,y1:y,y2:y,stroke:"var(--border)","stroke-width":1}));
    const t=svgEl("text",{x:padL-6,y:y+3,"text-anchor":"end","font-size":9,fill:"var(--fg-muted)"});
    t.textContent=(g*100)+"%"; svg.appendChild(t);
  });
  [[0.95,"var(--ok)"],[0.85,"var(--warn)"]].forEach(([v,c])=>{
    const y=padT+(1-v)*innerH;
    svg.appendChild(svgEl("line",{x1:padL,x2:w-padR,y1:y,y2:y,stroke:c,"stroke-width":1,"stroke-dasharray":"3,3",opacity:.55}));
  });
  bars.forEach((b,i)=>{
    const x0 = padL + i*bw + bw*0.18;
    const bw2 = bw*0.64;
    const val = b.value==null? 0 : b.value;
    const y = padT + (1-val)*innerH;
    const st = statusOf(b.value);
    const fill = b.value==null? "var(--na)" : (st==="ok"?"var(--ok)":st==="warn"?"var(--warn)":"var(--bad)");
    svg.appendChild(svgEl("rect",{x:x0,y,width:bw2,height:(padT+innerH-y),rx:4,fill}));
    const t=svgEl("text",{x:padL+i*bw+bw/2,y:h-20,"text-anchor":"middle","font-size":9.5,fill:"var(--fg)","font-weight":600});
    t.textContent=b.label; svg.appendChild(t);
    const t2=svgEl("text",{x:padL+i*bw+bw/2,y:h-8,"text-anchor":"middle","font-size":8.5,fill:"var(--fg-muted)"});
    t2.textContent= b.value==null? "sem dados" : pct(b.value); svg.appendChild(t2);
  });
}

function getStoredTheme(){
  try{ return localStorage.getItem("fb_theme") || "auto"; }catch(e){ return "auto"; }
}
function applyTheme(mode){
  if(mode==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  try{ localStorage.setItem("fb_theme", mode); }catch(e){}
  const btn = $("#theme-toggle");
  if(btn){
    btn.querySelector(".ti").innerHTML = THEME_ICONS[mode];
    btn.querySelector(".tl").textContent = THEME_LABELS[mode];
  }
}
function toggleTheme(){
  const order = ["auto","light","dark"];
  const cur = getStoredTheme();
  const next = order[(order.indexOf(cur)+1) % order.length];
  applyTheme(next);
}

let geralFilters = { ano:"todos", mes:"todos", setores:null }; // setores:null = todos selecionados

function semanaParts(iso){
  const d = new Date(iso+"T00:00:00");
  return { ano: d.getFullYear(), mes: d.getMonth()+1 };
}
const MES_NOMES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

function filteredEntriesFor(key){
  const sel = geralFilters.setores;
  if(sel && !sel.has(key)) return [];
  return entriesFor(key).filter(e=>{
    const {ano,mes} = semanaParts(e.semana);
    if(geralFilters.ano!=="todos" && String(ano)!==geralFilters.ano) return false;
    if(geralFilters.mes!=="todos" && String(mes)!==geralFilters.mes) return false;
    return true;
  });
}
function sectorsInView(){
  return geralFilters.setores ? SETORES.filter(s=>geralFilters.setores.has(s.key)) : SETORES;
}

let openSetorDropdown = null; // {ddEl, apply} — só um aberto por vez, listener global cuida do clique fora

function wireFilterBar(el, onChange){
  $("#fg-ano", el).onchange = (e)=>{ geralFilters.ano = e.target.value; onChange(); };
  $("#fg-mes", el).onchange = (e)=>{ geralFilters.mes = e.target.value; onChange(); };

  const dd = $("#fg-setor-dd", el);
  const btn = $("#fg-setor-btn", el);
  const panel = $("#fg-setor-panel", el);
  const allCb = $("#fg-setor-all", el);
  const itemCbs = $$(".setor-dd-item input[type=checkbox]", panel).filter(c=>c!==allCb);

  function syncAllCb(){
    const n = itemCbs.filter(c=>c.checked).length;
    allCb.checked = n===itemCbs.length;
    allCb.indeterminate = n>0 && n<itemCbs.length;
  }
  syncAllCb();

  function applyAndClose(){
    panel.hidden = true;
    openSetorDropdown = null;
    const checked = itemCbs.filter(c=>c.checked).map(c=>c.value);
    geralFilters.setores = checked.length===itemCbs.length ? null : new Set(checked);
    onChange();
  }

  btn.onclick = (ev)=>{
    ev.stopPropagation();
    if(!panel.hidden){ applyAndClose(); return; }
    panel.hidden = false;
    openSetorDropdown = { ddEl: dd, apply: applyAndClose };
  };
  allCb.onchange = ()=>{ itemCbs.forEach(c=> c.checked = allCb.checked); allCb.indeterminate=false; };
  itemCbs.forEach(c=> c.onchange = syncAllCb);
  $("#fg-setor-apply", el).onclick = (ev)=>{ ev.stopPropagation(); applyAndClose(); };
  panel.onclick = (ev)=> ev.stopPropagation();

  $("#btn-pdf-geral", el).onclick = (ev)=> generatePdfResumo(ev.target.closest("button"));
}
if(!window.__setorDdGlobalListener){
  window.__setorDdGlobalListener = true;
  document.addEventListener("click", ()=>{
    if(openSetorDropdown) openSetorDropdown.apply();
  });
}

function renderGeral(){
  const el = $("#view-geral");
  const setoresView = sectorsInView();
  const counts = {ok:0,warn:0,bad:0,na:0};
  setoresView.forEach(s=>{
    const list = filteredEntriesFor(s.key);
    const le = list.length? list[list.length-1] : null;
    const p = le? entryPct(le, s.itens) : null;
    counts[statusOf(p)]++;
  });

  el.innerHTML = `
    <div class="topbar">
      <div>
        <h2>Visão Geral — Todos os Setores</h2>
        <p>Status mais recente de cada setor, lado a lado. Preencha a auditoria semanal de cada setor na aba correspondente.</p>
      </div>
      <div class="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Conectando…</span></div>
    </div>

    ${renderFilterBar()}
    <div class="filter-empty" id="geral-empty" style="display:none">Nenhum registro encontrado para os filtros selecionados.</div>

    <div class="status-row">
      <div class="status-chip"><div class="n num" style="color:var(--ok)">${counts.ok}</div><div class="l">Bom (≥95%)</div></div>
      <div class="status-chip"><div class="n num" style="color:var(--warn)">${counts.warn}</div><div class="l">Atenção (85–95%)</div></div>
      <div class="status-chip"><div class="n num" style="color:var(--bad)">${counts.bad}</div><div class="l">Crítico (&lt;85%)</div></div>
      <div class="status-chip"><div class="n num" style="color:var(--na)">${counts.na}</div><div class="l">Sem dados</div></div>
    </div>

    <div class="grid-cards" id="geral-cards"></div>

    <div class="panel">
      <h3>Comparativo — semana mais recente de cada setor</h3>
      <div class="sub">Linhas tracejadas marcam as faixas de 85% (atenção) e 95% (bom).</div>
      <svg class="chart" id="geral-bar" style="height:220px"></svg>
    </div>

    <div class="panel">
      <h3>Evolução semanal — todos os setores</h3>
      <div class="sub">% de conformidade por semana. Para comparar bem, preencha todos os setores na mesma semana.</div>
      <svg class="chart" id="geral-line" style="height:230px"></svg>
      <div class="legend" id="geral-legend"></div>
    </div>
  `;

  wireFilterBar(el, ()=> renderGeral());
  applySyncIndicator();

  const anyData = setoresView.some(s=>filteredEntriesFor(s.key).length);
  $("#geral-empty", el).style.display = anyData ? "none" : "block";

  const cardsWrap = $("#geral-cards", el);
  setoresView.forEach(s=>{
    const list = filteredEntriesFor(s.key);
    const le = list.length? list[list.length-1]:null;
    const p = le? entryPct(le,s.itens): null;
    const st = statusOf(p);
    const card = document.createElement("div");
    card.className="card";
    card.onclick = ()=> setView(s.key);
    card.innerHTML = `
      <div class="card-top">
        <div class="name">${s.nome}</div>
        <div class="pill ${st}">${statusLabel(st)}</div>
      </div>
      <div class="pct num">${pct(p)}</div>
      <svg class="spark"></svg>
      <div class="meta">
        <span>${le? fmtDateFull(le.semana) : "sem auditoria"}</span>
        <span>${le? entryNC(le)+" NC" : ""}</span>
      </div>
    `;
    cardsWrap.appendChild(card);
    drawSparkline($("svg.spark",card), list.slice(-10).map(e=>({x:e.semana,y:entryPct(e,s.itens)})), s.cor);
  });

  drawBarChart($("#geral-bar", el), setoresView.map(s=>{
    const list = filteredEntriesFor(s.key);
    const le = list.length? list[list.length-1]:null;
    return {label:s.nome, value: le? entryPct(le,s.itens): null, color:s.cor};
  }), {});

  drawLineChart($("#geral-line", el), setoresView.map(s=>({
    name:s.nome, color:s.cor, semantic:false,
    points: filteredEntriesFor(s.key).map(e=>({x:e.semana, y:entryPct(e,s.itens)}))
  })), {});
  const legend = $("#geral-legend", el);
  legend.innerHTML = setoresView.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join("");
}

/* ============================================================
   5b. EXPORT PDF — resumo de todos os setores
   ============================================================ */
async function generatePdfResumo(btnEl){
  if(btnEl){ btnEl.disabled = true; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"pt", format:"a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const navy = [19,46,83], red = [235,28,44], grey=[91,107,128];

    doc.setFillColor(...navy);
    doc.rect(0,0,pageW,86,"F");
    try{ doc.addImage("data:image/png;base64,"+LOGO_B64, "PNG", 36, 18, 110, 47.6); }catch(e){}
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(15);
    doc.text("Resumo de Auditorias — Todos os Setores", pageW-36, 34, {align:"right"});
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    const periodo = (geralFilters.mes!=="todos"? MES_NOMES[+geralFilters.mes-1]+"/" : "") + (geralFilters.ano!=="todos"? geralFilters.ano : "Todos os períodos");
    const setoresLabel = geralFilters.setores ? sectorsInView().map(s=>s.nome).join(", ") : "Todos os setores";
    doc.text("Período: "+periodo, pageW-36, 50, {align:"right"});
    doc.text("Gerado em "+new Date().toLocaleDateString("pt-BR")+" · "+setoresLabel, pageW-36, 64, {align:"right"});

    const pageH = doc.internal.pageSize.getHeight();
    const bottomMargin = 56;
    const colsY0 = 118;

    function drawTableHead(y){
      doc.setTextColor(...navy);
      doc.setFont("helvetica","bold"); doc.setFontSize(11.5);
      doc.text("Setor", 36, y);
      doc.text("Última semana", 220, y);
      doc.text("Nota", 350, y);
      doc.text("NC", 410, y);
      doc.text("Status", 460, y);
      y += 6;
      doc.setDrawColor(...navy); doc.setLineWidth(1);
      doc.line(36, y, pageW-36, y);
      return y+16;
    }
    function newPage(){
      doc.addPage();
      return drawTableHead(40);
    }

    let y = drawTableHead(colsY0);

    doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
    const rows = sectorsInView().map(s=>{
      const list = filteredEntriesFor(s.key);
      const le = list.length? list[list.length-1] : null;
      const p = le? entryPct(le, s.itens) : null;
      const st = statusOf(p);
      const ncItems = le ? s.itens
        .map((it,i)=> le.itens[i]==="Não Conforme" ? it.texto : null)
        .filter(Boolean)
        : [];
      return { nome:s.nome, semana: le? fmtDateFull(le.semana) : "Sem dados", pct: le? pct(p) : "-", nc: le? entryNC(le) : "-", st, ncItems };
    });
    const stColor = { ok:[46,125,91], warn:[185,121,31], bad:[194,59,48], na:[140,151,161] };
    const stLabel = { ok:"Bom", warn:"Atenção", bad:"Crítico", na:"Sem dados" };

    rows.forEach((r)=>{
      const ncLines = r.ncItems.length
        ? doc.setFont("helvetica","normal").setFontSize(8.8).splitTextToSize("NC: "+r.ncItems.join("  •  "), pageW-72-14)
        : [];
      const rowH = 22 + (ncLines.length? ncLines.length*11 + 6 : 0);
      if(y + rowH > pageH - bottomMargin){ y = newPage(); }

      doc.setFillColor(245,247,250); doc.rect(32, y-12, pageW-64, rowH, "F");
      doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
      doc.setTextColor(22,35,61);
      doc.text(r.nome, 36, y);
      doc.text(r.semana, 220, y);
      doc.setFont("helvetica","bold"); doc.text(r.pct, 350, y); doc.setFont("helvetica","normal");
      doc.text(String(r.nc), 410, y);
      doc.setTextColor(...stColor[r.st]);
      doc.setFont("helvetica","bold"); doc.text(stLabel[r.st], 460, y); doc.setFont("helvetica","normal");
      y += 16;

      if(ncLines.length){
        doc.setFontSize(8.8);
        doc.setTextColor(...stColor.bad);
        ncLines.forEach(line=>{ doc.text(line, 46, y); y += 11; });
        y += 6;
      } else {
        y += 8;
      }
    });

    y += 10;
    if(y > pageH - bottomMargin - 46){ y = newPage(); }
    doc.setDrawColor(220,226,233); doc.line(36, y, pageW-36, y);
    y += 22;
    const totalNC = rows.reduce((a,r)=> a + (typeof r.nc==="number"? r.nc : 0), 0);
    const bons = rows.filter(r=>r.st==="ok").length;
    doc.setTextColor(...navy); doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text("Total de não conformidades (NC): "+totalNC, 36, y); y += 18;
    doc.text("Setores em conformidade (>= 95%): "+bons+" de "+rows.length, 36, y);

    const totalPages = doc.internal.getNumberOfPages();
    for(let pg=1; pg<=totalPages; pg++){
      doc.setPage(pg);
      doc.setTextColor(...grey); doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
      doc.text("Filtros Brasil · Painel de Auditoria de Qualidade", 36, pageH-24);
      doc.text("Página "+pg+" de "+totalPages, pageW-36, pageH-24, {align:"right"});
    }

    const blob = doc.output("blob");
    const fname = "Resumo_Auditoria_FiltrosBrasil_"+mondayISO(new Date())+".pdf";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }catch(err){
    alert("Não foi possível gerar o PDF agora. Tente novamente em instantes.");
  }
  if(btnEl){ btnEl.disabled = false; }
}

/* ============================================================
   6. RENDER — setor (checklist + historico)
   ============================================================ */
function renderSetor(key){
  const s = setorByKey[key];
  const el = $("#view-"+key);
  const list = entriesFor(key);
  const le = list.length? list[list.length-1] : null;
  const defaultWeek = mondayISO(new Date());
  const existingForWeek = list.find(e=>e.semana===defaultWeek);

  el.innerHTML = `
    <div class="topbar">
      <div>
        <h2>${s.nome}</h2>
        <p>${s.itens.length} itens de verificação · ${list.length} semana${list.length===1?"":"s"} registrada${list.length===1?"":"s"}</p>
      </div>
      <div class="pill ${le? statusOf(entryPct(le,s.itens)) : 'na'}" style="font-size:12.5px;padding:6px 14px">
        ${le? statusLabel(statusOf(entryPct(le,s.itens))) + " · " + pct(entryPct(le,s.itens)) : "Sem dados ainda"}
      </div>
    </div>

    <div class="sector-grid">
      <div class="panel" id="form-panel">
        <h3 id="form-title">Nova auditoria semanal</h3>
        <div class="sub" id="form-sub">Marque cada item e salve — fica disponível para todos na hora.</div>
        <div class="row2">
          <div>
            <label class="field">Semana (segunda-feira)</label>
            <input type="date" id="f-semana" value="${defaultWeek}">
          </div>
          <div>
            <label class="field">Responsável</label>
            <input type="text" id="f-resp" placeholder="Nome do auditor" value="${esc(existingForWeek?.responsavel||'')}">
          </div>
        </div>
        <div id="items-wrap" style="margin-top:14px"></div>
        <label class="field">Observações / plano de ação</label>
        <textarea id="f-obs" placeholder="Opcional">${esc(existingForWeek?.obs||'')}</textarea>
        <button class="btn-primary" id="f-save">Salvar auditoria da semana</button>
        <button class="btn-primary" id="f-cancel-edit" style="display:none;background:transparent;color:var(--fg-muted);border:1px solid var(--border);margin-left:8px">Cancelar edição</button>
        <div class="save-msg" id="f-msg" style="display:none"></div>
      </div>

      <div>
        <div class="panel">
          <h3>Evolução semanal — ${s.nome}</h3>
          <div class="sub">% de conformidade por semana.</div>
          <svg class="chart" id="sec-line" style="height:210px"></svg>
        </div>
        <div class="panel">
          <h3>Histórico</h3>
          <div class="tbl-wrap">
            <table class="hist" id="sec-table"></table>
          </div>
        </div>
      </div>
    </div>
  `;

  // estado local dos itens (status selecionado + observação por item), pre-popula se ja existe entrada na semana escolhida
  let itemState = existingForWeek ? existingForWeek.itens.slice() : new Array(s.itens.length).fill("");
  let itemObsState = existingForWeek ? (existingForWeek.itensObs || []).slice() : new Array(s.itens.length).fill("");
  while(itemObsState.length < s.itens.length) itemObsState.push("");

  function renderItems(){
    const wrap = $("#items-wrap", el);
    wrap.innerHTML = "";
    let lastCat = null;
    s.itens.forEach((it,i)=>{
      const row = document.createElement("div");
      row.className="item-row";
      let catHtml = "";
      if(it.cat && it.cat!==lastCat){ lastCat = it.cat; }
      if(it.cat) catHtml = `<span class="cat">${it.cat}</span><br>`;
      row.innerHTML = `
        ${catHtml}<div class="txt">${i+1}. ${it.texto}</div>
        <div class="seg" data-i="${i}">
          <button data-v="Conforme" class="${itemState[i]==='Conforme'?'sel':''}">Conforme</button>
          <button data-v="Não Conforme" class="${itemState[i]==='Não Conforme'?'sel':''}">Não Conforme</button>
          <button data-v="N/A" class="${itemState[i]==='N/A'?'sel':''}">N/A</button>
        </div>
        <input type="text" class="item-obs" data-i="${i}" placeholder="Observação deste item (opcional)" value="${esc(itemObsState[i]||"")}">
      `;
      wrap.appendChild(row);
    });
    $$(".seg",wrap).forEach(seg=>{
      $$("button",seg).forEach(btn=>{
        btn.onclick = ()=>{
          const i = +seg.dataset.i;
          itemState[i] = btn.dataset.v;
          $$("button",seg).forEach(b=>b.classList.remove("sel"));
          btn.classList.add("sel");
        };
      });
    });
    $$(".item-obs",wrap).forEach(inp=>{
      inp.oninput = ()=>{ itemObsState[+inp.dataset.i] = inp.value; };
    });
  }
  renderItems();

  function applyWeek(iso){
    $("#f-semana", el).value = iso;
    const ex = list.find(en=>en.semana===iso);
    itemState = ex? ex.itens.slice() : new Array(s.itens.length).fill("");
    itemObsState = ex? (ex.itensObs||[]).slice() : new Array(s.itens.length).fill("");
    while(itemObsState.length < s.itens.length) itemObsState.push("");
    $("#f-obs", el).value = ex?.obs || "";
    $("#f-resp", el).value = ex?.responsavel || "";
    renderItems();
    const title = $("#form-title", el), sub = $("#form-sub", el), saveBtn = $("#f-save", el), cancelBtn = $("#f-cancel-edit", el);
    if(ex){
      title.textContent = "Editando auditoria de " + fmtDateFull(iso);
      sub.textContent = "Esta semana já foi registrada — altere o que precisar e salve para atualizar.";
      saveBtn.textContent = "Atualizar auditoria da semana";
      cancelBtn.style.display = "inline-block";
    } else {
      title.textContent = "Nova auditoria semanal";
      sub.textContent = "Marque cada item e salve — fica disponível para todos na hora.";
      saveBtn.textContent = "Salvar auditoria da semana";
      cancelBtn.style.display = iso===defaultWeek ? "none" : "inline-block";
    }
  }

  $("#f-semana", el).onchange = (e)=> applyWeek(mondayISO(e.target.value));
  $("#f-cancel-edit", el).onclick = ()=> applyWeek(defaultWeek);
  window.editEntry_ = window.editEntry_ || {};
  window.editEntry_[key] = (iso)=>{
    applyWeek(iso);
    $("#form-panel", el).scrollIntoView({behavior:"smooth", block:"start"});
  };
  applyWeek(defaultWeek);

  $("#f-save", el).onclick = ()=> requestUnlock(doSaveEntry);

  async function doSaveEntry(){
    const msg = $("#f-msg", el);
    const semana = mondayISO($("#f-semana", el).value);
    const filled = itemState.filter(v=>v).length;
    if(filled===0){
      msg.textContent = "Marque ao menos um item antes de salvar."; msg.className="save-msg err"; msg.style.display="block";
      return;
    }
    const data = {
      id: key+"__"+semana,
      setor:key, semana,
      itens:itemState,
      itensObs:itemObsState,
      obs: $("#f-obs", el).value.trim(),
      responsavel: $("#f-resp", el).value.trim(),
      ts: Date.now(),
    };
    $("#f-save", el).disabled = true;
    try{
      if(!db) throw new Error("sem-conexao");
      const { error } = await db.from("entries").upsert(data);
      if(error) throw error;
      msg.textContent = "Salvo — já disponível para todos."; msg.className="save-msg"; msg.style.display="block";
    }catch(err){
      msg.textContent = "Não foi possível salvar agora. Verifique sua conexão e tente novamente.";
      msg.className="save-msg err"; msg.style.display="block";
    }
    $("#f-save", el).disabled = false;
  }

  // historico: grafico + tabela
  drawLineChart($("#sec-line", el), [{name:s.nome,color:s.cor,points:list.map(e=>({x:e.semana,y:entryPct(e,s.itens)}))}], {});

  const tbl = $("#sec-table", el);
  if(!list.length){
    tbl.outerHTML = `<div class="empty-state">Nenhuma auditoria registrada ainda neste setor.<br>Preencha o formulário ao lado para começar.</div>`;
  } else {
    tbl.innerHTML = `
      <thead><tr><th>Semana</th><th>% Geral</th><th>NC</th><th>Responsável</th><th>Observações</th><th></th><th></th></tr></thead>
      <tbody>
        ${list.slice().reverse().map((e,idx)=>{
          const p = entryPct(e,s.itens); const st=statusOf(p);
          const itemObs = (e.itensObs||[]).map((o,i)=> o && o.trim() ? {n:i+1, texto:s.itens[i]?.texto||"", v:e.itens[i], obs:o} : null).filter(Boolean);
          const hasDetail = itemObs.length>0;
          return `<tr class="hist-row" data-row="${idx}">
            <td>${fmtDateFull(e.semana)}</td>
            <td><span class="pill ${st}" style="padding:2px 8px">${pct(p)}</span></td>
            <td>${entryNC(e)}</td>
            <td>${esc(e.responsavel)||"—"}</td>
            <td>${esc(e.obs)||"—"}</td>
            <td>${hasDetail? `<span class="hist-toggle">${itemObs.length} obs. por item</span>`:""}</td>
            <td><span class="hist-toggle" data-edit="${e.semana}">Editar</span></td>
          </tr>
          <tr class="hist-detail" data-detail="${idx}"><td colspan="7"><div class="inner">
            ${itemObs.map(o=>`<div class="detail-item"><span class="dn">${o.n}.</span><span>${esc(o.texto)} — <b>${esc(o.v)||"—"}</b>: <span class="dv">${esc(o.obs)}</span></span></div>`).join("")}
          </div></td></tr>`;
        }).join("")}
      </tbody>
    `;
    $$(".hist-row",tbl).forEach(row=>{
      row.onclick = (ev)=>{
        if(ev.target.closest("[data-edit]")) return;
        const idx = row.dataset.row;
        const detail = $(`.hist-detail[data-detail="${idx}"]`,tbl);
        if(detail) detail.classList.toggle("open");
      };
    });
    $$("[data-edit]",tbl).forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        window.editEntry_[key](btn.dataset.edit);
      };
    });
  }
}

/* ============================================================
   7. BOOT — db + subscription
   ============================================================ */
function rerenderActive(){
  if(activeView==="geral") renderGeral(); else renderSetor(activeView);
  updateRailDots();
}
function updateRailDots(){
  SETORES.forEach(s=>{
    const dot = $(`.rail-dot[data-dot="${s.key}"]`);
    if(!dot) return;
    const le = latestEntry(s.key);
    const p = le? entryPct(le,s.itens): null;
    dot.className = "rail-dot " + (statusOf(p)==='na' ? '' : statusOf(p));
  });
}

async function boot(){
  buildRail();
  buildSkeleton();
  rerenderActive();

  try{
    if(SUPABASE_URL.indexOf("COLE_AQUI")===0){
      throw new Error("supabase-nao-configurado");
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    db = null;
    setConnStatus("var(--bad)", "Supabase não configurado — veja o guia de implantação");
    return;
  }

  async function reloadEntries(){
    const { data, error } = await db.from("entries").select("*");
    if(error){
      setConnStatus("var(--bad)", "Falha ao sincronizar — verifique as políticas do Supabase");
      return;
    }
    allEntries = data || [];
    rerenderActive();
    setConnStatus("var(--ok)", "Dados ao vivo");
  }

  await reloadEntries();

  db.channel("entries-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"entries" }, ()=> reloadEntries())
    .subscribe();
}

boot();

})();
</script>
